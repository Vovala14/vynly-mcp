name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) so MCP-aware agents/clients can
# discover @vynly/mcp. The npm package itself is published separately
# (see PUBLISHING.md); this only pushes the registry metadata.
#
# Auth: GitHub OIDC — no secret needed. The registry authorizes the
# `io.github.vovala14/*` namespace because this Action runs in a repo
# owned by Vovala14. Requires the npm package to already be live with a
# matching `mcpName` in its package.json.

on:
  push:
    tags: ["v*"] # e.g. v0.3.1
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
